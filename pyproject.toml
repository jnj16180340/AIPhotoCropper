[project]
name = "aiphotocropper"
version = "0.1.0"
description = "Automated cropping of scanned photographs using a local vision-language model"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "openai",
    "pillow",
    "tifffile",
]

[project.scripts]
crop = "crop:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = ["crop.py"]
